name: AFK Policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # `fetch-depth: 0` is required, not a preference: the decision-record
          # check resolves the merge base against `base.sha`, and a shallow
          # checkout does not have that commit — so the check would report that
          # it cannot see the diff, and a gate that cannot see the diff is not a
          # gate.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify AFK workflow boundaries
        run: node .sandcastle/policy-check.mjs workflows
      # The profile-network check decides whether the agent sandbox keeps Docker
      # bridge isolation. Without it in CI, a typo in the loopback-profile set
      # silently widens the sandbox's reach — or silently breaks the relay
      # profile — and nothing fails. It was a runnable check with no runner.
      - name: Verify sandbox network isolation
        run: npx --yes tsx .sandcastle/profile-network.check.ts
      - name: Verify sandbox MCP config
        run: npx --yes tsx .sandcastle/mcp-config.check.ts
      # A stale map is read with the same confidence as the code, so it is
      # checked rather than trusted. `--check` regenerates to stdout and
      # compares — it never writes the file it is judging.
      - name: Verify the repository map is current
        run: node .sandcastle/repo-map.check.mjs
      # The prepare hook's two halves must agree — a script nobody registered
      # silently reverts every run to the agent installing its own dependencies.
      - name: Verify the sandbox prepare hook
        run: npx --yes tsx .sandcastle/sandbox-prepare.check.ts
      # Whether a decision record is owed, and whether one was written.
      #
      # Two independent judgements, deliberately scoped differently:
      #   * STRUCTURE covers the records this change touches — so adopting the
      #     rule never requires backfilling a catalogue nobody edited.
      #   * COVERAGE covers each of this branch's commits, judged against its own
      #     parent. Per commit, not per diff: `git diff <ref> HEAD` is the
      #     merge-base form and reports everything the branch carries, so one
      #     tooling commit would answer for a feature commit beside it.
      #
      # A commit that owes a record and carries none fails here; one that owes
      # none says so with a `No-ADR:` line in its body. Nothing is pinned to a
      # ref — the script resolves the merge base itself.
      #
      # An empty `AFK_ADR_BASE` is a FAILURE, not a downgrade to a report. The
      # expression below evaluates to "" when neither side exists, and a gate that
      # quietly becomes a report reads as passing at exactly the moment it is
      # misconfigured.
      - name: Verify decision records
        env:
          AFK_ADR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .sandcastle/adr.check.mjs --base "$AFK_ADR_BASE"
      # The generator's own parser, not the map it produced: a regex that matches
      # nothing yields a map that looks complete and omits the answer, and a fresh
      # scaffold cannot catch that because a fresh scaffold has no console scripts
      # to omit. Deliberately NOT wired into repo-map.check.mjs — the map check
      # must use the shipping code path or it would validate one thing and ship
      # another.
      - name: Repository-map generator self-check
        run: node .sandcastle/repo-map.mjs --self-check
