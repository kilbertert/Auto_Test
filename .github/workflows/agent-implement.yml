name: Agent Implement

on:
  # `agent:implement` is an explicit execution authorization. The matching
  # shape guard below prevents PRDs and nested issues from running here.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true
      issue_title:
        description: Issue title (optional)
        required: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:implement'
    runs-on: self-hosted
    timeout-minutes: 60
    concurrency:
      group: agent-implement-issue-${{ inputs.issue_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      ISSUE_TITLE: ${{ inputs.issue_title || github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AFK_AGENT_GH_TOKEN: ${{ secrets.AFK_AGENT_READ_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Detect — does this issue have sub-issues or a parent?
        id: shape
        run: |
          # shellcheck disable=SC2016,SC2129
          set -euo pipefail
          issue_json=$(gh issue view "$ISSUE_NUMBER" --json title,body)
          title=$(echo "$issue_json" | jq -r '.title')
          body=$(echo "$issue_json" | jq -r '.body // ""')
          # Sub-issues: REST endpoint returns [] if none, list otherwise.
          sub_count=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/sub_issues" --jq 'length')
          # Parent: queried via GraphQL since REST doesn't expose it on the issue object.
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          parent_number=$(gh api graphql \
            -f query="query(\$owner: String!, \$repo: String!, \$num: Int!) { repository(owner: \$owner, name: \$repo) { issue(number: \$num) { parent { number } } } }" \
            -f owner="$owner" -f repo="$repo" -F num="$ISSUE_NUMBER" \
            --jq '.data.repository.issue.parent.number // empty')
          open_blockers=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/dependencies/blocked_by" \
            --jq '[.[] | select(.state == "open")] | length')
          is_prd="false"
          if echo "$title" | grep -qiE '\bprd\b|\[spec\]' || {
            echo "$body" | grep -q '^## Problem Statement' &&
            echo "$body" | grep -q '^## Solution' &&
            echo "$body" | grep -q '^## User Stories'
          }; then
            is_prd="true"
          fi
          if [ "$sub_count" != "0" ] || [ -n "$parent_number" ] || [ "$is_prd" = "true" ] || [ "$open_blockers" != "0" ]; then
            # Issue is itself a sub-issue. We refuse below.
            proceed="false"
          else
            proceed="true"
          fi
          {
            echo "sub_count=$sub_count"
            echo "parent_number=$parent_number"
            echo "is_prd=$is_prd"
            echo "open_blockers=$open_blockers"
            echo "proceed=$proceed"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse — issue is a PRD or has open native blockers
        if: steps.shape.outputs.proceed == 'false' && steps.shape.outputs.parent_number == ''
        env:
          IS_PRD: ${{ steps.shape.outputs.is_prd }}
          SUB_COUNT: ${{ steps.shape.outputs.sub_count }}
          OPEN_BLOCKERS: ${{ steps.shape.outputs.open_blockers }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          if [ "$SUB_COUNT" != "0" ] || [ "$IS_PRD" = "true" ]; then
            reason="This is a PRD or parent issue. Use /to-tickets first and run agent-implement-prd on the approved native sub-issues."
          else
            reason="This issue has ${OPEN_BLOCKERS} open native blocker(s)."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: $reason Cleared \`agent:implement\` and added \`agent:blocked\`."

      - name: Refuse — issue is a sub-issue of another issue
        if: steps.shape.outputs.proceed == 'false' && steps.shape.outputs.parent_number != ''
        env:
          PARENT_NUMBER: ${{ steps.shape.outputs.parent_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: this issue is a sub-issue of #${PARENT_NUMBER}. Sub-issues are not labeled directly — add \`agent:implement\` to the parent PRD instead. Cleared \`agent:implement\` and added \`agent:blocked\`."

      - name: Pre-flight — refuse if an open PR already exists for this issue
        if: steps.shape.outputs.proceed == 'true'
        id: preflight
        run: |
          set -euo pipefail
          # Find open PRs whose body references "Closes #N" / "Fixes #N" / "Resolves #N".
          existing=$(gh pr list \
            --state open \
            --search "in:body \"#${ISSUE_NUMBER}\"" \
            --json number,url,body \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves)\\\\s+#${ISSUE_NUMBER}\\\\b\"))]")
          count=$(echo "$existing" | jq 'length')
          if [ "$count" -gt 0 ]; then
            url=$(echo "$existing" | jq -r '.[0].url')
            echo "existing_pr_url=$url" >> "$GITHUB_OUTPUT"
            echo "refused=true" >> "$GITHUB_OUTPUT"
          else
            echo "refused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight refusal — comment + remove label, exit
        if: steps.preflight.outputs.refused == 'true'
        env:
          EXISTING_PR_URL: ${{ steps.preflight.outputs.existing_pr_url }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: PR $EXISTING_PR_URL already targets this issue. Close it first, then re-add \`agent:implement\`."
          exit 0

      - name: Transition labels — remove implement/blocked, add in-progress
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout main with runner HOME and managed Git hooks
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: |
          set -euo pipefail
          gh auth setup-git
          if [ -d .git ]; then
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://github.com/${GH_REPO}.git"
            git fetch --depth 1 origin main
            git checkout -B main FETCH_HEAD
            git branch --list 'agent/*' 'sandcastle/*' | xargs -r git branch -D 2>/dev/null || true
          else
            git clone --branch main --depth 1 "https://github.com/${GH_REPO}.git" .
          fi

      - name: Compute branch name
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        id: branch
        run: |
          slug=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-50)
          branch="agent/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"


      - name: Setup Node.js 22
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: npm ci

      - name: Run implement.ts
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        id: implement
        env:
          AFK_PROFILE: ${{ vars.AFK_PROFILE || 'psydo' }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npm exec tsx .sandcastle/implement/implement.ts

      - name: Verify AFK policy before push
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        run: node .sandcastle/policy-check.mjs delivery

      - name: Push branch
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "AGENT_PAT is required to push the implementation branch." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          gh auth setup-git
          if ! git push origin "$BRANCH"; then
            echo "AGENT_PAT could not push the implementation branch." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi

      - name: Write PR title and description
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          AFK_PROFILE: ${{ vars.AFK_PROFILE || 'psydo' }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npm exec tsx .sandcastle/write-pr/write-pr.ts

      - name: Open PR
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        id: open_pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          # GITHUB_TOKEN may be restricted from creating pull requests by the
          # repository Actions policy. AGENT_PAT is the host-side delivery
          # credential and never enters the Docker agent.
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$AGENT_PAT" ]; then
            echo "AGENT_PAT is required to create the delivery pull request." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          PR_TITLE=$(cat "${RUNNER_TEMP}/pr_title.txt")
          PR_TITLE="${PR_TITLE:0:256}"
          if ! pr_url=$(GH_TOKEN="$AGENT_PAT" gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file "${RUNNER_TEMP}/pr_description.txt" | tail -n1); then
            echo "AGENT_PAT could not create the delivery pull request." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          pr_number=$(basename "$pr_url")
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Request automated review (add agent:review label)
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          # Prefer AGENT_PAT so the labeled event triggers agent-review.yml
          # (GITHUB_TOKEN-driven label adds do not trigger downstream workflows).
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$AGENT_PAT" ]; then
            echo "AGENT_PAT is required to trigger the review workflow." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          if ! GH_TOKEN="$AGENT_PAT" gh pr edit "$PR_NUMBER" --add-label "agent:review"; then
            echo "AGENT_PAT could not add the agent:review trigger label." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi

      - name: Mark blocked on failure
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written — check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "$(cat <<EOF
          \`agent:implement\` run failed.

          **Reason:** $reason

          **Workflow run:** $RUN_URL

          Re-add \`agent:implement\` to retry.
          EOF
          )"

      - name: Always remove in-progress
        if: always() && steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
