name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic checks
        run: npm run check

  windows-verify:
    name: Windows Verify
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run deterministic checks
        run: npm run check

      - name: Verify Windows bootstrap
        shell: cmd
        env:
          AUTO_TEST_CODEX_BASE_URL: https://example.invalid/v1
          AUTO_TEST_CODEX_HOME: ${{ runner.temp }}auto-test-codex
          AUTO_TEST_PERSIST_API_KEY: "0"
          AUTO_TEST_SKIP_API_PROBE: "1"
          AUTO_TEST_TOOLS_HOME: ${{ runner.temp }}auto-test-tools
          CLIPROXYAPI_KEY: synthetic-ci-key
        run: Auto-Test.cmd --setup-only

      - name: Verify generated Codex provider config
        shell: pwsh
        env:
          AUTO_TEST_CODEX_HOME: ${{ runner.temp }}auto-test-codex
          AUTO_TEST_TOOLS_HOME: ${{ runner.temp }}auto-test-tools
        run: |
          $configPath = Join-Path $env:AUTO_TEST_CODEX_HOME 'config.toml'
          if (-not (Test-Path $configPath)) { throw 'Codex config was not created' }
          $config = Get-Content -Raw -Encoding UTF8 $configPath
          if ($config -notmatch 'model_provider = "cliproxyapi"') { throw 'Provider was not configured' }
          if ($config -notmatch 'wire_api = "responses"') { throw 'Responses API was not configured' }
          if ($config -match 'synthetic-ci-key') { throw 'API key leaked into config.toml' }
          if (Test-Path (Join-Path $env:AUTO_TEST_CODEX_HOME 'provider-key.dpapi')) { throw 'CI key was persisted despite opt-out' }
          $codex = Join-Path $env:AUTO_TEST_TOOLS_HOME 'node_modules\.bin\codex.cmd'
          if ((& $codex --version) -notmatch '0\.144\.5') { throw 'Unexpected Codex CLI version' }
