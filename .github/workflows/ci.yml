name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        env:
          # GitHub's ubuntu runner prefers azure.archive.ubuntu.com
          # (priority:1 in /etc/apt/apt-mirrors.txt), which has been stalling
          # so `npx playwright install --with-deps` hangs in apt-get update
          # until the job timeout. Drop the azure mirror from apt-mirrors.txt
          # so apt falls back to archive.ubuntu.com, then run `--with-deps`
          # (Playwright installs the full system-dependency set itself).
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium

      - name: Run deterministic checks
        run: npm run check

      - name: Verify private Windows package assembly
        env:
          AUTO_TEST_MODEL_API_KEY: synthetic-private-package-key
          AUTO_TEST_CODEX_BASE_URL: https://model-api.example.test/v1
          AUTO_TEST_CODEX_MODEL: synthetic-model
        run: |
          scripts/build-private-windows-package.sh
          package="$(find artifacts/private-release -name 'Auto-Test-Windows-private-*.zip' -print -quit)"
          test -n "$package"
          test "$(unzip -p "$package" Auto-Test.private-key)" = 'synthetic-private-package-key'
          test "$(unzip -p "$package" Auto-Test.private-provider.json | jq -r .baseUrl)" = 'https://model-api.example.test/v1'
          test "$(unzip -p "$package" Auto-Test.private-provider.json | jq -r .model)" = 'synthetic-model'

# `Windows Verify` was deleted here (2026-10-13). It ran on `windows-latest`, which this
# account cannot use: the hosted-runner billing lock makes the job unable to start at all
# ("The job was not started because your account is locked due to a billing issue"), and
# the host has no Windows machine to move it to. It was also a required status check, so
# every pull request was blocked by a job that could never run.
#
# The Windows FEATURE is untouched: `scripts/build-private-windows-package.sh`,
# `Auto-Test.cmd`, the launcher tests and the acceptance runbooks all still exist. What is
# gone is CI running it on Windows. `Verify` still checks the package ASSEMBLY (that the
# archive contains the expected private-key and provider, with the expected values), which
# is the half of this that a Linux runner can actually decide.
